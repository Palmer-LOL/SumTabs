<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SumTabs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page popup">
  <div class="popup__title"><strong>SumTabs</strong></div>

  <div class="popup__status-card" id="statusCard">
    <div class="popup__status-row">
      <div class="popup__status-label">Active hostname</div>
      <div class="popup__status-value" id="activeHostname">Loading…</div>
    </div>

    <div class="popup__status-row">
      <div class="popup__status-label">Grouping target</div>
      <div class="popup__status-value" id="groupingTarget">Loading…</div>
    </div>

    <div class="settings__small-text" id="groupingExplanation">Checking this tab’s grouping status…</div>
  </div>

  <div class="popup__status-card" id="quickActionsCard" hidden>
    <div class="popup__status-row">
      <div class="popup__status-label">Quick actions for this tab</div>
      <div class="settings__small-text">Update separation rules without opening Settings.</div>
    </div>

    <div class="popup__status-row" id="exactActionRow">
      <div class="popup__status-value" id="exactActionLabel">Separate only this hostname</div>
      <div class="settings__small-text" id="exactActionStatus"></div>
      <button class="button button--full-width" id="toggleExactAction" type="button">Add rule</button>
    </div>

    <div class="popup__status-row" id="domainActionRow">
      <div class="popup__status-value" id="domainActionLabel">Separate all matching subdomains</div>
      <div class="settings__small-text" id="domainActionStatus"></div>
      <button class="button button--full-width" id="toggleDomainAction" type="button">Add rule</button>
    </div>

    <div class="popup__status-row" id="bundleActionRow">
      <label class="popup__status-value" for="bundleSelect">Add the active hostname to custom domain bundle:</label>
      <select class="popup__select" id="bundleSelect"></select>
      <div class="settings__small-text" id="bundleActionStatus"></div>
      <div class="popup__button-row">
        <button class="button" id="applyBundleAction" type="button">Apply</button>
        <button class="button" id="manageBundles" type="button">Manage bundles</button>
      </div>
    </div>
  </div>

  <button class="button button--full-width" id="forceReevaluate" type="button">Reevaluate open tabs now</button>
  <button class="button button--full-width" id="openSettings">Open Settings</button>
  <button class="button button--full-width button--danger" id="closeAllInWindow" type="button">Close all unpinned tabs (this window)</button>

  <div class="settings__small-text popup__description--muted">
    Groups tabs by domain. No network calls.
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
